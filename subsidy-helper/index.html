<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>補助小幫手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #1a1a1a;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #f5c518;
      padding: 20px 24px 16px;
      text-align: center;
      border-bottom: 3px solid #d4a800;
    }
    header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: 2px;
    }
    header p {
      font-size: 13px;
      color: #5a4800;
      margin-top: 4px;
    }

    /* ── Main container ── */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* ── Screen management ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Category buttons ── */
    #screen-home h2 {
      font-size: 15px;
      color: #f5c518;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 18px 22px;
      margin-bottom: 14px;
      background: #f5c518;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
      transition: background 0.15s, transform 0.1s;
      gap: 14px;
    }
    .cat-btn:hover { background: #ffd63a; transform: scale(1.02); }
    .cat-btn:active { transform: scale(0.98); }
    .cat-btn .icon {
      font-size: 26px;
      line-height: 1;
    }

    /* ── Subsidy list screen ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 2px solid #f5c518;
      border-radius: 12px;
      color: #f5c518;
      font-size: 14px;
      font-weight: 600;
      padding: 7px 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .back-btn:hover { background: #f5c51820; }

    #screen-list h2 {
      font-size: 18px;
      font-weight: 800;
      color: #f5c518;
      margin-bottom: 16px;
    }

    .subsidy-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 18px;
      margin-bottom: 10px;
      background: #2a2a2a;
      border: 1.5px solid #3a3a3a;
      border-radius: 16px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f0;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }
    .subsidy-item:hover {
      border-color: #f5c518;
      background: #2e2b1a;
    }
    .subsidy-item .arrow {
      color: #f5c518;
      font-size: 18px;
    }

    /* ── Detail screen ── */
    #screen-detail .detail-header {
      background: #f5c518;
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    #screen-detail .detail-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: #1a1a1a;
    }
    #screen-detail .detail-header p {
      font-size: 13px;
      color: #5a4800;
      margin-top: 4px;
    }

    .tab-bar {
      display: flex;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid #f5c518;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: #2a2a2a;
      color: #f5c518;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab-btn.active {
      background: #f5c518;
      color: #1a1a1a;
    }
    .tab-btn:not(:last-child) {
      border-right: 1px solid #f5c518;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .detail-card {
      background: #2a2a2a;
      border: 1.5px solid #3a3a3a;
      border-radius: 16px;
      padding: 18px;
    }
    .detail-card h3 {
      font-size: 14px;
      color: #f5c518;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #3a3a3a;
    }
    .detail-card ul {
      list-style: none;
      padding: 0;
    }
    .detail-card ul li {
      font-size: 14px;
      color: #e0e0e0;
      padding: 6px 0;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }
    .detail-card ul li:last-child { border-bottom: none; }
    .detail-card ul li::before {
      content: "▸";
      color: #f5c518;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-list { list-style: none; padding: 0; counter-reset: steps; }
    .step-list li {
      counter-increment: steps;
      font-size: 14px;
      color: #e0e0e0;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
    }
    .step-list li:last-child { border-bottom: none; }
    .step-list li::before {
      content: counter(steps);
      background: #f5c518;
      color: #1a1a1a;
      font-weight: 800;
      font-size: 12px;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .map-placeholder {
      background: #222;
      border: 1.5px dashed #f5c518;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: #f5c518;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .map-placeholder .map-icon { font-size: 36px; margin-bottom: 8px; }

    .office-item {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #e0e0e0;
    }
    .office-item strong { color: #f5c518; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

<header>
  <h1>🌟 補助小幫手</h1>
  <p>找到適合你的社會補助資源</p>
</header>

<main>

  <!-- ① 首頁：五大類別 -->
  <div id="screen-home" class="screen active">
    <h2>請選擇你的身份類別</h2>

    <button class="cat-btn" onclick="showList('elder')">
      <span class="icon">👴</span>長者
    </button>
    <button class="cat-btn" onclick="showList('lowincome')">
      <span class="icon">🏠</span>中低收入戶
    </button>
    <button class="cat-btn" onclick="showList('disability')">
      <span class="icon">♿</span>身心障礙者
    </button>
    <button class="cat-btn" onclick="showList('indigenous')">
      <span class="icon">🌿</span>原住民及新住民
    </button>
    <button class="cat-btn" onclick="showList('singleparent')">
      <span class="icon">👩‍👦</span>單親家庭
    </button>
  </div>

  <!-- ② 補助細項列表 -->
  <div id="screen-list" class="screen">
    <button class="back-btn" onclick="goBack('home')">← 返回</button>
    <h2 id="list-title"></h2>
    <div id="list-items"></div>
  </div>

  <!-- ③ 補助詳細內容 -->
  <div id="screen-detail" class="screen">
    <button class="back-btn" onclick="goBack('list')">← 返回列表</button>
    <div class="detail-header">
      <h2 id="detail-title"></h2>
      <p id="detail-subtitle"></p>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('intro')">簡介</button>
      <button class="tab-btn" onclick="switchTab('process')">流程</button>
      <button class="tab-btn" onclick="switchTab('docs')">必備文件</button>
      <button class="tab-btn" onclick="switchTab('map')">地圖</button>
    </div>

    <div id="tab-intro" class="tab-content active">
      <div class="detail-card">
        <h3>補助說明</h3>
        <ul id="detail-intro-list"></ul>
      </div>
    </div>
    <div id="tab-process" class="tab-content">
      <div class="detail-card">
        <h3>申請流程</h3>
        <ol class="step-list" id="detail-process-list"></ol>
      </div>
    </div>
    <div id="tab-docs" class="tab-content">
      <div class="detail-card">
        <h3>必備文件</h3>
        <ul id="detail-docs-list"></ul>
      </div>
    </div>
    <div id="tab-map" class="tab-content">
      <div class="map-placeholder">
        <div class="map-icon">📍</div>
        <div>請前往附近公所或社會局辦理</div>
      </div>
      <div id="detail-offices"></div>
    </div>
  </div>

</main>

<script>

        }
      ]
    },
    disability: {
      title: "♿ 身心障礙補助",
      items: [
        {

          process: ["備妥文件向戶籍地公所提出申請", "公所審核障礙等級及經濟狀況", "審核通過後次月起發放"],
          docs: ["申請書", "身心障礙手冊或證明", "身分證及戶口名簿", "財稅資料同意書", "存款帳戶影本"],
          offices: [{ name: "各區公所社會課", addr: "請依戶籍地查詢" }]
        },
        {
          name: "輔具費用補助",
          subtitle: "購買輔助器具補助",
          intro: ["輪椅、助聽器、視障輔具等均可申請", "依項目補助 2,000～100,000 元不等", "每項每隔一定年限可再申請", "須先經評估再購買"],
          process: ["向公所或醫院評估", "取得評估報告後購買輔具", "檢附發票向公所申請補助", "審核通過後撥款"],

          offices: [{ name: "各縣市輔具中心", addr: "請洽各縣市社會局查詢" }]

    },

          docs: ["外僑居留證或定居證", "戶口名簿", "結婚證明", "視補助項目備齊相關文件"],
          offices: [{ name: "內政部移民署各服務站", addr: "☎ 0800-024-111" }]
        }
      ]
    },
    singleparent: {
      title: "👩‍👦 單親家庭補助",
      items: [
        {
          name: "特殊境遇家庭扶助",
          subtitle: "單親家庭緊急生活補助",
          intro: ["緊急生活扶助：每人每月 4,955 元，最長 6 個月", "子女生活津貼：每名子女每月 3,228 元", "兒童托育津貼：每名子女每月最高 5,000 元", "需符合特殊境遇條件（離婚、喪偶、受暴等）"],

  // ── 狀態 ──
  let currentCat = null;

  // ── 畫面切換 ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function goBack(to) { showScreen(to); }

  // ── 顯示補助列表 ──
  function showList(cat) {
    currentCat = cat;
    const catData = DATA[cat];
    document.getElementById('list-title').textContent = catData.title;
    const container = document.getElementById('list-items');
    container.innerHTML = '';
    catData.items.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.className = 'subsidy-item';
      btn.innerHTML = `<span>${item.name}<br><small style="font-weight:400;color:#aaa;font-size:12px;">${item.subtitle}</small></span><span class="arrow">›</span>`;
      btn.onclick = () => showDetail(idx);
      container.appendChild(btn);
    });
    showScreen('list');
  }

  // ── 顯示補助詳情 ──
  function showDetail(idx) {
    const item = DATA[currentCat].items[idx];
    document.getElementById('detail-title').textContent = item.name;
    document.getElementById('detail-subtitle').textContent = item.subtitle;

    // 填入各 tab 資料
    fillList('detail-intro-list', item.intro, 'ul');
    fillList('detail-process-list', item.process, 'ol');
    fillList('detail-docs-list', item.docs, 'ul');

    const officesEl = document.getElementById('detail-offices');
    officesEl.innerHTML = item.offices.map(o =>
      `<div class="office-item"><strong>${o.name}</strong>${o.addr}</div>`
    ).join('');

    // 重設 tab
    switchTab('intro');
    showScreen('detail');
  }

  function fillList(elId, arr, type) {
    const el = document.getElementById(elId);
    el.innerHTML = arr.map(t => `<li>${t}</li>`).join('');
  }

  // ── Tab 切換 ──
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      const tabs = ['intro', 'process', 'docs', 'map'];
      b.classList.toggle('active', tabs[i] === name);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
  }
</script>

</body>
</html>
