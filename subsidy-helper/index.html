<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>補助小幫手 — 找到適合你的社會補助</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #f5c518;
      --yellow-dark: #d4a800;
      --yellow-light: #fff8d6;
      --bg: #111111;
      --surface: #1e1e1e;
      --surface2: #2a2a2a;
      --border: #333333;
      --text: #f0f0f0;
      --muted: #999999;
      --radius: 20px;
    }

    body {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ══════════════ NAVBAR ══════════════ */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(17,17,17,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-logo-icon {
      width: 34px; height: 34px;
      background: var(--yellow);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .nav-logo-text {
      font-size: 17px;
      font-weight: 800;
      color: var(--yellow);
      letter-spacing: 1px;
    }
    .nav-logo-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }
    .nav-links {
      display: flex;
      gap: 4px;
    }
    .nav-links a {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .nav-links a:hover { background: var(--surface2); color: var(--text); }

    /* ══════════════ HERO ══════════════ */
    .hero {
      padding: 52px 20px 40px;
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 14px;
      font-size: 12px;
      color: var(--yellow);
      margin-bottom: 18px;
      font-weight: 600;
    }
    .hero h1 {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .hero h1 span { color: var(--yellow); }
    .hero p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* ── 搜尋框 ── */
    .search-wrap {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .search-wrap:focus-within { border-color: var(--yellow); }
    .search-wrap input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap button {
      background: var(--yellow);
      border: none;
      border-radius: 10px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 700;
      color: #111;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-wrap button:hover { background: #ffd63a; }

    /* ── 統計列 ── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 28px;
    }
    .stat-item { text-align: center; }
    .stat-item .num { font-size: 22px; font-weight: 800; color: var(--yellow); }
    .stat-item .label { font-size: 12px; color: var(--muted); }

    /* ══════════════ SECTION TITLE ══════════════ */
    .section {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ══════════════ CATEGORY CARDS ══════════════ */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }
    .cat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .cat-card:hover {
      border-color: var(--yellow);
      background: #1e1b0a;
      transform: translateY(-2px);
    }
    .cat-card:active { transform: translateY(0); }
    .cat-card .c-icon {
      font-size: 28px;
      width: 48px; height: 48px;
      background: var(--surface2);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cat-card .c-text h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .cat-card .c-text p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    /* 第五個按鈕全寬置中 */
    .cat-grid-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cat-grid-last {
      display: flex;
      justify-content: center;
    }
    .cat-grid-last .cat-card {
      width: calc(50% - 6px);
    }

    /* ══════════════ FEATURED SUBSIDY LIST ══════════════ */
    .subsidy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-decoration: none;
    }
    .subsidy-row:hover { border-color: var(--yellow); background: #1e1b0a; }
    .subsidy-row .sr-left { display: flex; align-items: center; gap: 12px; }
    .subsidy-row .sr-tag {
      font-size: 11px;
      font-weight: 700;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      color: var(--yellow);
      white-space: nowrap;
    }
    .subsidy-row .sr-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .subsidy-row .sr-sub { font-size: 12px; color: var(--muted); }
    .subsidy-row .sr-arrow { color: var(--yellow); font-size: 18px; flex-shrink: 0; }

    /* ══════════════ MODAL OVERLAY ══════════════ */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 0 0 32px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── 類別列表 modal ── */
    .modal-header {
      position: sticky; top: 0;
      background: var(--surface);
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 { font-size: 17px; font-weight: 800; }
    .modal-close {
      width: 30px; height: 30px;
      background: var(--surface2);
      border: none; border-radius: 50%;
      color: var(--text); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .modal-list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .modal-list-item:last-child { border-bottom: none; }
    .modal-list-item:hover { background: var(--surface2); }
    .modal-list-item .ml-left h3 { font-size: 15px; font-weight: 600; }
    .modal-list-item .ml-left p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .modal-list-item .ml-arrow { color: var(--yellow); font-size: 18px; }

    /* ── 補助詳情 modal ── */
    .detail-hero {
      background: var(--yellow);
      padding: 20px 20px 18px;
    }
    .detail-hero .dh-tag {
      font-size: 11px; font-weight: 700;
      background: rgba(0,0,0,0.15);
      border-radius: 6px; padding: 2px 8px;
      color: #1a1a1a; display: inline-block; margin-bottom: 8px;
    }
    .detail-hero h2 { font-size: 20px; font-weight: 900; color: #1a1a1a; }
    .detail-hero p { font-size: 13px; color: #5a4800; margin-top: 4px; }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 0; z-index: 10;
    }
    .tab-btn {
      flex: 1; padding: 12px 4px;
      background: none; border: none;
      color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--yellow); border-bottom-color: var(--yellow); }

    .tab-content { display: none; padding: 18px 20px; }
    .tab-content.active { display: block; }

    .info-block { margin-bottom: 18px; }
    .info-block h3 {
      font-size: 12px; font-weight: 700;
      color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .info-block ul { list-style: none; }
    .info-block ul li {
      font-size: 14px; color: var(--text);
      padding: 7px 0; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 8px; line-height: 1.5;
    }
    .info-block ul li:last-child { border-bottom: none; }
    .info-block ul li::before { content: "▸"; color: var(--yellow); flex-shrink: 0; margin-top: 2px; }

    .step-list { list-style: none; counter-reset: steps; }
    .step-list li {
      counter-increment: steps;
      font-size: 14px; color: var(--text);
      padding: 10px 0; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px; line-height: 1.5;
    }
    .step-list li:last-child { border-bottom: none; }
    .step-list li::before {
      content: counter(steps);
      background: var(--yellow); color: #111;
      font-weight: 800; font-size: 12px;
      min-width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .doc-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px;
      font-size: 13px; color: var(--text);
      margin: 0 6px 8px 0;
    }
    .doc-chip::before { content: "📄"; font-size: 13px; }

    .office-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    }
    .office-card strong { color: var(--yellow); display: block; margin-bottom: 4px; font-size: 14px; }
    .office-card span { font-size: 13px; color: var(--muted); }

    /* ══════════════ FOOTER ══════════════ */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--yellow); text-decoration: none; }

    /* ══════════════ RWD ══════════════ */
    @media (max-width: 480px) {
      .hero h1 { font-size: 26px; }
      .cat-grid-last .cat-card { width: 100%; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav>
  <a class="nav-logo" href="#">
    <div class="nav-logo-icon">🌟</div>
    <div>
      <div class="nav-logo-text">補助小幫手</div>
      <div class="nav-logo-sub">社會補助查詢平台</div>

  <div class="nav-links">
    <a href="#categories">類別</a>

    <a href="#">關於</a>
  </div>
</nav>

<!-- ── Hero ── -->
<div class="hero">

  <div class="stats">

    <div class="stat-item"><div class="num">即時</div><div class="label">資料更新</div></div>
  </div>
</div>

<!-- ── Categories ── -->
<div class="section" id="categories">
  <div class="section-title">補助類別</div>
  <div class="cat-grid-wrap">
    <div class="cat-grid">
      <div class="cat-card" onclick="openListModal('elder')">
        <div class="c-icon">👴</div>

      </div>
      <div class="cat-card" onclick="openListModal('lowincome')">

      </div>
      <div class="cat-card" onclick="openListModal('disability')">
        <div class="c-icon">♿</div>
        <div class="c-text"><h3>身心障礙</h3><p>生活補助、輔具費用</p></div>
      </div>
      <div class="cat-card" onclick="openListModal('indigenous')">
        <div class="c-icon">🌿</div>
        <div class="c-text"><h3>原住民及新住民</h3><p>生活輔助、適應補助</p></div>
      </div>
    </div>
    <div class="cat-grid-last">
      <div class="cat-card" onclick="openListModal('singleparent')">
        <div class="c-icon">👩‍👦</div>
        <div class="c-text"><h3>單親家庭</h3><p>特殊境遇、子女津貼</p></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Featured ── -->
<div class="section" id="featured">
  <div class="section-title">精選補助項目</div>
  <div id="featured-list"></div>
</div>

<!-- ── Footer ── -->
<footer>
  補助小幫手 · 資料來源：衛生福利部、各地方政府<br>
  如有疑問請洽各地公所社會課或撥打 <a href="#">1957 社福專線</a>
</footer>

<!-- ══════════ Modal：類別列表 ══════════ -->
<div class="overlay" id="overlay-list" onclick="closeIfBg(event,'overlay-list')">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-list-title"></h2>
      <button class="modal-close" onclick="closeModal('overlay-list')">✕</button>
    </div>
    <div id="modal-list-body"></div>
  </div>
</div>

<!-- ══════════ Modal：補助詳情 ══════════ -->
<div class="overlay" id="overlay-detail" onclick="closeIfBg(event,'overlay-detail')">
  <div class="modal">
    <div class="detail-hero">
      <div class="dh-tag" id="detail-cat-tag"></div>
      <h2 id="detail-name"></h2>
      <p id="detail-sub"></p>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('intro')">簡介</button>
      <button class="tab-btn" onclick="switchTab('process')">流程</button>
      <button class="tab-btn" onclick="switchTab('docs')">必備文件</button>
      <button class="tab-btn" onclick="switchTab('map')">地圖</button>
    </div>
    <div id="tab-intro" class="tab-content active"></div>
    <div id="tab-process" class="tab-content"></div>
    <div id="tab-docs" class="tab-content"></div>
    <div id="tab-map" class="tab-content"></div>
  </div>
</div>

// ══════════ 精選清單 ══════════
const FEATURED = [
  { cat:'elder',      idx:0 },
  { cat:'lowincome',  idx:0 },
  { cat:'disability', idx:1 },
  { cat:'singleparent', idx:0 },
];
(function renderFeatured() {
  const el = document.getElementById('featured-list');
  FEATURED.forEach(({cat, idx}) => {
    const catData = DATA[cat];
    const item = catData.items[idx];
    const div = document.createElement('div');
    div.className = 'subsidy-row';
    div.innerHTML = `
      <div class="sr-left">
        <span class="sr-tag">${catData.tag}</span>
        <div>
          <div class="sr-name">${item.name}</div>
          <div class="sr-sub">${item.sub}</div>
        </div>
      </div>
      <span class="sr-arrow">›</span>`;
    div.onclick = () => { currentCat = cat; openDetailModal(idx); };
    el.appendChild(div);
  });
})();

// ══════════ 搜尋 ══════════
function handleSearch(val) {
  val = val.trim().toLowerCase();
  if (!val) return;
  let found = null, foundCat = null;
  Object.entries(DATA).forEach(([cat, catData]) => {
    catData.items.forEach((item, idx) => {
      if (!found && (item.name.toLowerCase().includes(val) || item.sub.toLowerCase().includes(val))) {
        found = idx; foundCat = cat;
      }
    });
  });
  if (found !== null) { currentCat = foundCat; openDetailModal(found); }
  else { alert('找不到相關補助，請嘗試其他關鍵字'); }
}

// ══════════ Modal 控制 ══════════
let currentCat = null;

function openListModal(cat) {
  currentCat = cat;
  const catData = DATA[cat];
  document.getElementById('modal-list-title').textContent = catData.title;
  const body = document.getElementById('modal-list-body');
  body.innerHTML = '';
  catData.items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'modal-list-item';
    div.innerHTML = `
      <div class="ml-left">
        <h3>${item.name}</h3>
        <p>${item.sub}</p>
      </div>
      <span class="ml-arrow">›</span>`;
    div.onclick = () => { closeModal('overlay-list'); openDetailModal(idx); };
    body.appendChild(div);
  });
  document.getElementById('overlay-list').classList.add('open');
}

function openDetailModal(idx) {
  const catData = DATA[currentCat];
  const item = catData.items[idx];
  document.getElementById('detail-cat-tag').textContent = catData.tag;
  document.getElementById('detail-name').textContent = item.name;
  document.getElementById('detail-sub').textContent = item.sub;

  // 簡介
  document.getElementById('tab-intro').innerHTML = `
    <div class="info-block"><h3>補助說明</h3>
    <ul>${item.intro.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

  // 流程
  document.getElementById('tab-process').innerHTML = `
    <div class="info-block"><h3>申請步驟</h3>
    <ol class="step-list">${item.process.map(t=>`<li>${t}</li>`).join('')}</ol></div>`;

  // 文件
  document.getElementById('tab-docs').innerHTML = `
    <div class="info-block"><h3>需備文件</h3>
    <div style="margin-top:4px">${item.docs.map(t=>`<span class="doc-chip">${t}</span>`).join('')}</div></div>`;

  // 地圖
  document.getElementById('tab-map').innerHTML = `
    <div class="info-block"><h3>洽辦地點</h3>
    ${item.offices.map(o=>`<div class="office-card"><strong>${o.name}</strong><span>${o.addr}</span></div>`).join('')}
    </div>
    <div style="background:var(--surface2);border:1.5px dashed var(--yellow);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13px;">
      📍 地圖功能即將上線
    </div>`;

  switchTab('intro');
  document.getElementById('overlay-detail').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
function closeIfBg(e, id) {
  if (e.target.id === id) closeModal(id);
}

function switchTab(name) {
  const tabs = ['intro','process','docs','map'];
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', tabs[i]===name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}
</script>
