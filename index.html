<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣補助查詢地圖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a56a0;
      color: #fff;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .main-layout {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── 左側地圖 ── */
    .map-panel {
      flex: 0 0 380px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .map-panel h2 {
      font-size: 14px;
      color: #57606a;
      margin-bottom: 12px;
      font-weight: 500;
    }

    #taiwan-map {
      width: 100%;
      height: auto;
    }

    /* 縣市 path 樣式 */
    .county-path {
      stroke: #fff;
      stroke-width: 0.8;
      cursor: not-allowed;
      transition: opacity 0.15s ease, stroke-width 0.15s ease;
    }

    .county-path.active {
      cursor: pointer;
    }

    .county-path.active:hover {
      opacity: 0.75;
    }

    .county-path.selected {
      stroke: #1a3a6e;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 5px rgba(26,86,160,0.55));
    }

    /* 縣市顏色 */
    .c-keelung      { fill: #a8d5ba; }
    .c-taipei       { fill: #4e9af1; }
    .c-new-taipei   { fill: #6cb4e4; }
    .c-taoyuan      { fill: #cc80ff; }
    .c-hsinchu-city { fill: #aaaaaa; }
    .c-hsinchu      { fill: #c5c5c5; }
    .c-miaoli       { fill: #00d4d4; }
    .c-taichung     { fill: #a0c96c; }
    .c-changhua     { fill: #66b2b2; }
    .c-nantou       { fill: #4db870; }
    .c-yunlin       { fill: #5bc0de; }
    .c-chiayi-city  { fill: #f0ad4e; }
    .c-chiayi       { fill: #ffd27f; }
    .c-tainan       { fill: #c8a2d4; }
    .c-kaohsiung    { fill: #ff8c69; }
    .c-pingtung     { fill: #7fbf7f; }
    .c-yilan        { fill: #b87c5a; }
    .c-hualien      { fill: #ff80c0; }
    .c-taitung      { fill: #7ec8e3; }
    .c-penghu       { fill: #e8e066; }
    .c-kinmen       { fill: #d4a96a; }
    .c-lienchiang   { fill: #aaaaff; }
    .c-default      { fill: #d1d5db; }

    .county-path.active.c-kaohsiung:hover { fill: #e5663a; }
    .county-path.selected.c-kaohsiung     { fill: #e5663a; }

    /* 縣市標籤 */
    .county-label {
      font-size: 9px;
      fill: #2c2c2c;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      pointer-events: none;
      user-select: none;
      font-weight: 700;
      text-anchor: middle;
    }

    /* ── 右側資訊框 ── */
    .info-panel {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 28px;
      display: flex;
      flex-direction: column;
    }

    .info-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      text-align: center;
      gap: 12px;
    }

    .info-placeholder p { font-size: 15px; }

    .info-content {
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .info-content.visible { display: flex; }

    .info-county-title {
      font-size: 22px;
      font-weight: 700;
      color: #1f2328;
      border-left: 4px solid #1a56a0;
      padding-left: 12px;
    }

    .subsidy-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 18px;
      background: #f7f8fa;
    }

    .subsidy-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2328;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #57606a;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      margin-top: 14px;
    }

    .conditions-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .conditions-list li {
      font-size: 14px;
      color: #374151;
      padding: 6px 10px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .conditions-list li::before { content: "▸"; color: #1a56a0; flex-shrink: 0; margin-top: 1px; }

    .checklist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      margin-top: 14px;
    }

    .copy-btn {
      font-size: 12px;
      padding: 5px 12px;
      background: #1a56a0;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: #154688; }
    .copy-btn.copied { background: #16a34a; }

    .checklist { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .checklist li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #374151;
      padding: 8px 10px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      transition: background 0.1s;
    }
    .checklist li:hover { background: #f0f4ff; }
    .checklist li input[type="checkbox"] { width: 16px; height: 16px; accent-color: #1a56a0; cursor: pointer; flex-shrink: 0; }
    .checklist li.checked { text-decoration: line-through; color: #9ca3af; background: #f9fafb; }

    .not-available {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: #9ca3af;
      text-align: center;
      gap: 10px;
    }
    .not-available.visible { display: flex; }

    @media (max-width: 720px) {
      .main-layout { flex-direction: column; }
      .map-panel { flex: none; }
    }
  </style>
</head>
<body>

<header>📋 台灣補助查詢系統</header>

<div class="main-layout">

  <!-- 左側地圖 -->
  <div class="map-panel">
    <h2>點擊縣市查詢補助資訊</h2>
    <svg id="taiwan-map" viewBox="0 0 380 560" xmlns="http://www.w3.org/2000/svg">
      <g id="counties-group"></g>
      <g id="labels-group"></g>
    </svg>
  </div>

  <!-- 右側資訊框 -->
  <div class="info-panel">
    <div class="info-placeholder" id="info-placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <path d="M20,8 L28,4 L42,8 L44,18 L40,30 L32,38 L22,42 L14,36 L10,24 L12,14 Z"
          stroke="#9ca3af" stroke-width="2" fill="none"/>
        <circle cx="32" cy="22" r="3" fill="#9ca3af"/>
        <line x1="32" y1="27" x2="32" y2="34" stroke="#9ca3af" stroke-width="2"/>
      </svg>
      <p>請在左邊點擊要查看的縣市</p>
      <p style="font-size:12px; color:#b0b8c1;">目前僅高雄市有補助資料</p>
    </div>

    <div class="info-content" id="info-content">
      <div class="info-county-title" id="county-title"></div>
      <div id="subsidies-container"></div>
    </div>

    <div class="not-available" id="not-available">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="20" stroke="#d1d5db" stroke-width="2"/>
        <line x1="16" y1="16" x2="32" y2="32" stroke="#d1d5db" stroke-width="2"/>
        <line x1="32" y1="16" x2="16" y2="32" stroke="#d1d5db" stroke-width="2"/>
      </svg>
      <p id="not-available-msg">此縣市資料尚未開放</p>
    </div>
  </div>
</div>

<!-- topojson-client (解析 TopoJSON) -->
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
// ── 縣市 ID 對照表（TopoJSON properties.id → CSS class / 資料檔名）──
const COUNTY_MAP = {
  "09007": { cls: "c-lienchiang", id: "lienchiang", name: "連江縣" },
  "09020": { cls: "c-kinmen",     id: "kinmen",     name: "金門縣" },
  "10002": { cls: "c-yilan",      id: "yilan",      name: "宜蘭縣" },
  "10007": { cls: "c-changhua",   id: "changhua",   name: "彰化縣" },
  "10008": { cls: "c-nantou",     id: "nantou",     name: "南投縣" },
  "10009": { cls: "c-yunlin",     id: "yunlin",     name: "雲林縣" },
  "10013": { cls: "c-pingtung",   id: "pingtung",   name: "屏東縣" },
  "10014": { cls: "c-taitung",    id: "taitung",    name: "臺東縣" },
  "10015": { cls: "c-hualien",    id: "hualien",    name: "花蓮縣" },
  "10016": { cls: "c-penghu",     id: "penghu",     name: "澎湖縣" },
  "10017": { cls: "c-keelung",    id: "keelung",    name: "基隆市" },
  "10018": { cls: "c-hsinchu-city", id: "hsinchu-city", name: "新竹市" },
  "63000": { cls: "c-taipei",     id: "taipei",     name: "臺北市" },
  "65000": { cls: "c-new-taipei", id: "new-taipei", name: "新北市" },
  "66000": { cls: "c-taichung",   id: "taichung",   name: "臺中市" },
  "67000": { cls: "c-tainan",     id: "tainan",     name: "臺南市" },
  "68000": { cls: "c-taoyuan",    id: "taoyuan",    name: "桃園市" },
  "10005": { cls: "c-miaoli",     id: "miaoli",     name: "苗栗縣" },
  "10004": { cls: "c-hsinchu",    id: "hsinchu",    name: "新竹縣" },
  "10020": { cls: "c-chiayi-city", id: "chiayi-city", name: "嘉義市" },
  "10010": { cls: "c-chiayi",     id: "chiayi",     name: "嘉義縣" },
  "64000": { cls: "c-kaohsiung",  id: "kaohsiung",  name: "高雄市" },
};

// 有補助資料的縣市
const AVAILABLE = new Set(["kaohsiung"]);

// ── TopoJSON → SVG path 轉換（不使用 d3，手寫投影）──
function topoToSVGPaths(topo) {
  const { scale, translate } = topo.transform;
  const geoms = topo.objects.map.geometries;

  // 先把所有 arc 解碼成絕對座標
  const decodedArcs = topo.arcs.map(arc => {
    let x = 0, y = 0;
    return arc.map(([dx, dy]) => { x += dx; y += dy; return [x, y]; });
  });

  // 計算所有點的地理範圍（經緯度）
  let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
  decodedArcs.forEach(arc => {
    arc.forEach(([qx, qy]) => {
      const lon = qx * scale[0] + translate[0];
      const lat = qy * scale[1] + translate[1];
      if (lon < minLon) minLon = lon;
      if (lon > maxLon) maxLon = lon;
      if (lat < minLat) minLat = lat;
      if (lat > maxLat) maxLat = lat;
    });
  });

  // 投影：經緯度 → SVG 座標 (viewBox 0 0 380 560)
  // FILL = 地圖填滿比例；SHIFT_X = 整體往右偏移像素
  const SVG_W = 380, SVG_H = 560, PAD = 4, FILL = 1.6, SHIFT_X = 40;
  const lonRange = maxLon - minLon;
  const latRange = maxLat - minLat;
  const scaleX = (SVG_W - PAD * 2) * FILL / lonRange;
  const scaleY = (SVG_H - PAD * 2) * FILL / latRange;
  const mapScale = Math.min(scaleX, scaleY);
  const offsetX = PAD + (SVG_W - PAD * 2 - lonRange * mapScale) / 2 + SHIFT_X;
  const offsetY = PAD + (SVG_H - PAD * 2 - latRange * mapScale) / 2;

  function project(qx, qy) {
    const lon = qx * scale[0] + translate[0];
    const lat = qy * scale[1] + translate[1];
    const px = offsetX + (lon - minLon) * mapScale;
    const py = offsetY + (maxLat - lat) * mapScale; // Y 軸翻轉
    return [px.toFixed(2), py.toFixed(2)];
  }

  // 把 arcs 索引轉成 SVG path d 字串
  function arcsToDStr(arcIndexArrays) {
    let d = "";
    arcIndexArrays.forEach(ring => {
      let ringD = "";
      ring.forEach(arcIdx => {
        const reversed = arcIdx < 0;
        const arc = decodedArcs[reversed ? ~arcIdx : arcIdx];
        const pts = reversed ? [...arc].reverse() : arc;
        pts.forEach((pt, i) => {
          const [px, py] = project(pt[0], pt[1]);
          ringD += (i === 0 ? (ringD ? "L" : "M") : "L") + px + "," + py;
        });
      });
      d += ringD + "Z";
    });
    return d;
  }

  // 計算一個 ring 群的點數（用於取最大塊）
  function ringPointCount(polyArcs) {
    return polyArcs[0].reduce((sum, arcIdx) => {
      return sum + decodedArcs[arcIdx < 0 ? ~arcIdx : arcIdx].length;
    }, 0);
  }

  return geoms.map(geom => {
    let d = "";
    if (geom.type === "Polygon") {
      d = arcsToDStr(geom.arcs);
    } else if (geom.type === "MultiPolygon") {
      // 只保留點數最多（面積最大）的那塊，去掉無名小島
      const largest = geom.arcs.reduce((best, poly) =>
        ringPointCount(poly) > ringPointCount(best) ? poly : best
      );
      d = arcsToDStr(largest);
    }
    return { props: geom.properties, d, type: geom.type };
  });
}

// ── 計算 polygon 重心（用於標籤位置）──
function centroid(dStr) {
  const pts = [];
  const re = /[ML]([\d.]+),([\d.]+)/g;
  let m;
  while ((m = re.exec(dStr)) !== null) pts.push([parseFloat(m[1]), parseFloat(m[2])]);
  if (!pts.length) return [0, 0];
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  return [cx, cy];
}

// ── 離島在 SVG 畫布上的重新定位 ──
// transform="translate(tx,ty) scale(s)"，tx/ty 是相對原始投影座標的偏移
const ISLAND_OVERRIDES = {
  "penghu":     { tx: 20,  ty: -100, s: 2.2 },  // 澎湖：台灣左側中段
  "kinmen":     { tx: -20, ty: -430, s: 3.0 },  // 金門：左上角
  "lienchiang": { tx: 30,  ty: -480, s: 3.5 },  // 連江（馬祖）：金門右側
};

// ── 渲染地圖 ──
async function renderMap() {
  const res = await fetch("taiwan-country.topo.json");
  const topo = await res.json();
  const paths = topoToSVGPaths(topo);

  const group = document.getElementById("counties-group");
  const labelGroup = document.getElementById("labels-group");

  paths.forEach(({ props, d }) => {
    if (!d) return;
    const info = COUNTY_MAP[props.id];
    const cls = info ? info.cls : "c-default";
    const countyId = info ? info.id : props.id;
    const countyName = info ? info.name : props.name;
    const isActive = info && AVAILABLE.has(info.id);
    const override = ISLAND_OVERRIDES[countyId];

    // 離島用 <g transform> 包裝，搬移到指定位置
    const container = override
      ? (() => {
          const [cx, cy] = centroid(d);
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          // 先以重心為原點縮放，再平移到目標位置
          g.setAttribute("transform",
            `translate(${(cx * (override.s - 1) + override.tx).toFixed(1)}, ${(cy * (override.s - 1) + override.ty).toFixed(1)}) scale(${override.s})`
          );
          return g;
        })()
      : null;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("class", `county-path ${cls}${isActive ? " active" : ""}`);
    path.dataset.county = countyId;
    path.dataset.name = countyName;

    if (container) {
      container.appendChild(path);
      group.appendChild(container);
    } else {
      group.appendChild(path);
    }

    // 標籤
    const [cx, cy] = centroid(d);
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("class", "county-label");
    text.textContent = countyName.length > 2 ? countyName.slice(0, 2) : countyName;

    if (override) {
      // transform="translate(tx,ty) scale(s)" 後螢幕座標 = (s*cx + tx, s*cy + ty)
      // 此處 tx = cx*(s-1)+override.tx，故最終 = s*cx + cx*(s-1)+override.tx = cx*(2s-1)+override.tx
      const gTx = parseFloat((cx * (override.s - 1) + override.tx).toFixed(1));
      const gTy = parseFloat((cy * (override.s - 1) + override.ty).toFixed(1));
      const finalX = (override.s * cx + gTx).toFixed(1);
      const finalY = (override.s * cy + gTy + 3).toFixed(1);
      text.setAttribute("x", finalX);
      text.setAttribute("y", finalY);
    } else {
      text.setAttribute("x", cx);
      text.setAttribute("y", cy + 3);
    }

    labelGroup.appendChild(text);
  });

  // 綁定點擊事件
  bindMapEvents();
}

// ── 點擊事件 ──
let selectedPath = null;

function bindMapEvents() {
  document.querySelectorAll(".county-path").forEach(path => {
    path.addEventListener("click", async function () {
      const countyId = this.dataset.county;
      const countyName = this.dataset.name;
      if (!countyId) return;

      if (selectedPath) selectedPath.classList.remove("selected");
      this.classList.add("selected");
      selectedPath = this;

      if (AVAILABLE.has(countyId)) {
        const data = await loadCountyData(countyId);
        data ? renderSubsidyInfo(data) : showNotAvailable(countyName);
      } else {
        showNotAvailable(countyName);
      }
    });
  });
}

// ── 載入 JSON ──
async function loadCountyData(countyId) {
  try {
    const res = await fetch(`data/${countyId}.json`);
    if (!res.ok) throw new Error();
    return await res.json();
  } catch { return null; }
}

// ── 渲染補助資訊 ──
function renderSubsidyInfo(data) {
  document.getElementById("info-placeholder").style.display = "none";
  document.getElementById("not-available").classList.remove("visible");

  document.getElementById("county-title").textContent = data.county + " 補助資訊";
  const container = document.getElementById("subsidies-container");
  container.innerHTML = "";

  data.subsidies.forEach(subsidy => {
    const card = document.createElement("div");
    card.className = "subsidy-card";

    const title = document.createElement("div");
    title.className = "subsidy-title";
    title.textContent = "📌 " + subsidy.title;
    card.appendChild(title);

    if (subsidy.conditions?.length) {
      const lbl = document.createElement("div");
      lbl.className = "section-label";
      lbl.textContent = "申請條件";
      card.appendChild(lbl);
      const ul = document.createElement("ul");
      ul.className = "conditions-list";
      subsidy.conditions.forEach(c => {
        const li = document.createElement("li");
        li.textContent = c;
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }

    if (subsidy.documents?.length) {
      const hdr = document.createElement("div");
      hdr.className = "checklist-header";
      const lbl = document.createElement("div");
      lbl.className = "section-label";
      lbl.style.cssText = "margin-top:0;margin-bottom:0;";
      lbl.textContent = "所需文件 Checklist";
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "📋 複製清單";

      const ul2 = document.createElement("ul");
      ul2.className = "checklist";
      subsidy.documents.forEach(doc => {
        const li = document.createElement("li");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        const span = document.createElement("span");
        span.textContent = doc;
        li.appendChild(cb);
        li.appendChild(span);
        li.addEventListener("click", e => {
          if (e.target !== cb) cb.checked = !cb.checked;
          li.classList.toggle("checked", cb.checked);
        });
        ul2.appendChild(li);
      });

      btn.addEventListener("click", () => {
        const lines = [...ul2.querySelectorAll("li")].map(li => {
          const checked = li.querySelector("input").checked;
          return (checked ? "✅ " : "☐ ") + li.querySelector("span").textContent;
        });
        navigator.clipboard.writeText(lines.join("\n")).then(() => {
          btn.textContent = "✅ 已複製！";
          btn.classList.add("copied");
          setTimeout(() => { btn.textContent = "📋 複製清單"; btn.classList.remove("copied"); }, 2000);
        });
      });

      hdr.appendChild(lbl);
      hdr.appendChild(btn);
      card.appendChild(hdr);
      card.appendChild(ul2);
    }

    container.appendChild(card);
  });

  document.getElementById("info-content").classList.add("visible");
}

// ── 未開放提示 ──
function showNotAvailable(name) {
  document.getElementById("info-placeholder").style.display = "none";
  document.getElementById("info-content").classList.remove("visible");
  document.getElementById("not-available-msg").textContent = `${name}：此縣市資料尚未開放`;
  document.getElementById("not-available").classList.add("visible");
}

// 啟動
renderMap();
</script>
